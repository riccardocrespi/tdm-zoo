[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tdm-zoo"
version = "0.1.0"
description = "Trapdoored-matrix candidates over finite fields and a framework for their cryptanalysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "python-flint>=0.7",
]

[project.optional-dependencies]
cuda = ["torch>=2.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "cuda: requires a CUDA-enabled PyTorch installation",
    "slow: long-running test",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
